<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="t d" style="width:100%;height:auto;max-width:960px">
<title id="t">A Friday at 17:42, an illustrative scenario</title><desc id="d">A customer pays at 17:42, a deploy kills the worker mid-task, the order stays payment pending with no alert, and support hears about it on Monday.</desc>
<rect width="960" height="330" rx="16" fill="#16201b" stroke="#2a382e"/>
<text x="40" y="50" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#eef4ee" text-anchor="start">A Friday at 17:42</text>
<text x="40" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a4b4a8" text-anchor="start">Illustrative scenario</text>
<line x1="130" y1="170" x2="850" y2="170" stroke="#2a382e" stroke-width="4"/>
<line x1="370" y1="170" x2="850" y2="170" stroke="#e5bc85" stroke-width="4" stroke-dasharray="3 9"/>
<text x="130" y="130" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="18" font-weight="700" fill="#6fc59a" text-anchor="middle">17:42</text>
<circle cx="130" cy="170" r="22" fill="#0d1410" stroke="#6fc59a" stroke-width="4"/>
<path d="M121 170 l7 8 l12 -16" fill="none" stroke="#6fc59a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="130" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#eef4ee" text-anchor="middle">Customer pays</text>
<text x="130" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#a4b4a8" text-anchor="middle">The card is charged.</text>
<text x="370" y="130" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="18" font-weight="700" fill="#e5bc85" text-anchor="middle">17:42</text>
<circle cx="370" cy="170" r="22" fill="#0d1410" stroke="#e5bc85" stroke-width="4"/>
<path d="M362 162 l16 16 M378 162 l-16 16" stroke="#e5bc85" stroke-width="4" stroke-linecap="round"/>
<text x="370" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#eef4ee" text-anchor="middle">Worker dies</text>
<text x="370" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#a4b4a8" text-anchor="middle">A deploy restarts its</text>
<text x="370" y="272" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#a4b4a8" text-anchor="middle">container mid-task.</text>
<text x="610" y="130" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="18" font-weight="700" fill="#e5bc85" text-anchor="middle">17:43</text>
<circle cx="610" cy="170" r="22" fill="#0d1410" stroke="#e5bc85" stroke-width="4"/>
<circle cx="610" cy="170" r="6" fill="#e5bc85"/>
<text x="610" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#eef4ee" text-anchor="middle">Nothing fires</text>
<text x="610" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#a4b4a8" text-anchor="middle">The order stays “payment</text>
<text x="610" y="272" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#a4b4a8" text-anchor="middle">pending”. No error, no</text>
<text x="610" y="294" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#a4b4a8" text-anchor="middle">alert.</text>
<text x="850" y="130" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="18" font-weight="700" fill="#e5bc85" text-anchor="middle">Monday</text>
<circle cx="850" cy="170" r="22" fill="#0d1410" stroke="#e5bc85" stroke-width="4"/>
<circle cx="850" cy="170" r="6" fill="#e5bc85"/>
<text x="850" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#eef4ee" text-anchor="middle">Support email</text>
<text x="850" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#a4b4a8" text-anchor="middle">“I paid and never got my</text>
<text x="850" y="272" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#a4b4a8" text-anchor="middle">order.”</text>
</svg>