<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 488" role="img" aria-labelledby="t d" style="width:100%;height:auto;max-width:960px">
<title id="t">What holding the connection does to task throughput</title><desc id="d">At 4 workers and 20,000 tasks, a new connection per task gave 430 tasks per second on django-ox and 373 on django-tasks-db. Persistent connections gave 1,771 and 1,211. A pool gave 1,718 and 1,216.</desc>
<rect width="960" height="488" rx="16" fill="#16201b" stroke="#2a382e"/>
<text x="40" y="50" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#eef4ee" text-anchor="start">What holding the connection does</text>
<text x="40" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#a4b4a8" text-anchor="start">Tasks per second, 20,000 tasks, 4 workers</text>
<rect x="40" y="100" width="14" height="14" rx="3" fill="#6fc59a"/><text x="62" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#eef4ee" text-anchor="start">django-ox</text><rect x="180" y="100" width="14" height="14" rx="3" fill="#8a9a90"/><text x="202" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#eef4ee" text-anchor="start">django-tasks-db</text>
<text x="40" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#eef4ee" text-anchor="start">New connection per task</text>
<text x="40" y="206" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="14" font-weight="400" fill="#a4b4a8" text-anchor="False">CONN_MAX_AGE = 0</text>
<rect x="300" y="160" width="140.31578947368422" height="26" rx="4" fill="#6fc59a"/><text x="450.3157894736842" y="180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#6fc59a" text-anchor="start">430</text>
<rect x="300" y="192" width="121.71578947368421" height="26" rx="4" fill="#8a9a90"/><text x="431.7157894736842" y="212" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#a4b4a8" text-anchor="start">373</text>
<text x="40" y="274" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#eef4ee" text-anchor="start">Persistent connections</text>
<text x="40" y="298" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="14" font-weight="400" fill="#a4b4a8" text-anchor="False">CONN_MAX_AGE = 600</text>
<rect x="300" y="252" width="577.9052631578948" height="26" rx="4" fill="#6fc59a"/><text x="887.9052631578948" y="272" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#6fc59a" text-anchor="start">1,771</text>
<rect x="300" y="284" width="395.1684210526316" height="26" rx="4" fill="#8a9a90"/><text x="705.1684210526316" y="304" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#a4b4a8" text-anchor="start">1,211</text>
<text x="40" y="366" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#eef4ee" text-anchor="start">Django connection pool</text>
<text x="40" y="390" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="14" font-weight="400" fill="#a4b4a8" text-anchor="False">OPTIONS["pool"]</text>
<rect x="300" y="344" width="560.6105263157895" height="26" rx="4" fill="#6fc59a"/><text x="870.6105263157895" y="364" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#6fc59a" text-anchor="start">1,718</text>
<rect x="300" y="376" width="396.8" height="26" rx="4" fill="#8a9a90"/><text x="706.8" y="396" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#a4b4a8" text-anchor="start">1,216</text>
<line x1="300" y1="150" x2="300" y2="416" stroke="#2a382e"/>
<text x="40" y="444" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a4b4a8" text-anchor="start">Without a held connection the spread between runs is 9%, so read the first row as about 400.</text>
<text x="40" y="468" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#a4b4a8" text-anchor="start">django-ox 1.9.0 vs django-tasks-db 0.13.0, PostgreSQL 16, no-op tasks, medians of five runs.</text>
</svg>